name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ImageMagick (pixel QA engine)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install test deps
        run: pip install -r requirements.txt

      - name: Unit tests (QA + planner)
        run: python -m pytest tests/unit -q

      - name: Web syntax check
        run: |
          for f in web/*.js; do
            node --check "$f"
            echo "OK $f"
          done

      - name: Entry document sanity
        run: |
          grep -q 'id="generate"' web/index.html
          grep -q 'data-tab="media"' web/index.html
          grep -q 'id="carStrip"' web/index.html
          grep -q 'id="layers"' web/index.html
          echo "OK index.html"
